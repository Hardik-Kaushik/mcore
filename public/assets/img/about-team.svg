    <circle r="10" cy="-4" fill="#e63946" opacity="0.4"/>
    <rect x="-12" y="10" width="24" height="4" rx="2" fill="#5b7a9d" opacity="0.5"/>
  </g>
  <g transform="translate(120, 130)">
    <circle r="28" fill="#fff" stroke="#e5eaf0" stroke-width="1.5"/>
    <circle r="10" cy="-4" fill="#ff6b6b" opacity="0.3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Cloud shape -->
  <path d="M140 200 C140 150 180 110 230 110 C260 70 330 70 360 110 C410 110 440 150 440 190 C440 230 410 260 370 260 L160 260 C140 260 120 240 120 220 C120 208 128 200 140 200Z" fill="#10243a" stroke="#1b3a5f" stroke-width="2"/>
  <!-- Inner cloud details -->
  <rect x="180" y="150" width="140" height="80" rx="10" fill="#162d45"/>
  <rect x="196" y="166" width="60" height="6" rx="3" fill="#e63946" opacity="0.6"/>
  <rect x="196" y="180" width="100" height="6" rx="3" fill="#5b7a9d" opacity="0.4"/>
  <rect x="196" y="194" width="80" height="6" rx="3" fill="#4ecdc4" opacity="0.4"/>
  <rect x="196" y="208" width="40" height="6" rx="3" fill="#5b7a9d" opacity="0.3"/>
  <!-- Server nodes below -->
  <g transform="translate(120, 290)">
    <rect width="70" height="50" rx="8" fill="#fff" stroke="#e5eaf0" stroke-width="1"/>
    <circle cx="22" cy="20" r="6" fill="#e63946" opacity="0.5"/>
    <rect x="36" y="16" width="22" height="4" rx="2" fill="#5b7a9d" opacity="0.5"/>
    <rect x="14" y="34" width="42" height="4" rx="2" fill="#5b7a9d" opacity="0.3"/>
  </g>
  <g transform="translate(215, 290)">
    <rect width="70" height="50" rx="8" fill="#fff" stroke="#e5eaf0" stroke-width="1"/>
    <circle cx="22" cy="20" r="6" fill="#4ecdc4" opacity="0.5"/>
    <rect x="36" y="16" width="22" height="4" rx="2" fill="#5b7a9d" opacity="0.5"/>
    <rect x="14" y="34" width="42" height="4" rx="2" fill="#5b7a9d" opacity="0.3"/>
  </g>
  <g transform="translate(310, 290)">
    <rect width="70" height="50" rx="8" fill="#fff" stroke="#e5eaf0" stroke-width="1"/>
    <circle cx="22" cy="20" r="6" fill="#e63946" opacity="0.3"/>
    <rect x="36" y="16" width="22" height="4" rx="2" fill="#5b7a9d" opacity="0.5"/>
    <rect x="14" y="34" width="42" height="4" rx="2" fill="#5b7a9d" opacity="0.3"/>
  </g>
  <!-- Connection lines from cloud to servers -->
  <line x1="155" y1="260" x2="155" y2="290" stroke="#e63946" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="250" y1="260" x2="250" y2="290" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="345" y1="260" x2="345" y2="290" stroke="#e63946" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <!-- Upload/download arrows -->
  <polygon points="240,140 250,125 260,140" fill="#e63946" opacity="0.5"/>
  <polygon points="340,140 350,155 360,140" fill="#4ecdc4" opacity="0.5"/>
</svg>

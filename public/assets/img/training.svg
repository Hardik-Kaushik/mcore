<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none">
  <style>
    @keyframes float1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes float2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes float3 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
    @keyframes pulse { 0%,100%{opacity:0.5;r:6} 50%{opacity:1;r:9} }
    @keyframes dash { to { stroke-dashoffset: -40; } }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes fadeSlide { 0%{opacity:0;transform:translateX(-10px)} 30%{opacity:1;transform:translateX(0)} 70%{opacity:1;transform:translateX(0)} 100%{opacity:0;transform:translateX(10px)} }
    .fl1 { animation: float1 4s ease-in-out infinite; }
    .fl2 { animation: float2 3.5s ease-in-out infinite 0.5s; }
    .fl3 { animation: float3 5s ease-in-out infinite 1s; }
    .pls { animation: pulse 2s ease-in-out infinite; }
    .dsh { animation: dash 3s linear infinite; }
    .spn { animation: spin 12s linear infinite; transform-origin: 260px 210px; }
  </style>

  <!-- Background glow -->
  <ellipse cx="260" cy="380" rx="200" ry="30" fill="#ff6b6b" opacity="0.12"/>
  <circle cx="420" cy="80" r="120" fill="#e63946" opacity="0.06"/>
  <circle cx="80" cy="340" r="100" fill="#4ecdc4" opacity="0.05"/>

  <!-- Spinning orbit ring -->
  <circle cx="260" cy="210" r="140" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.15" class="spn"/>

  <!-- Main laptop -->
  <g class="fl1">
    <rect x="120" y="130" width="280" height="180" rx="14" fill="#ffffff" stroke="#e5eaf0" stroke-width="2"/>
    <rect x="120" y="130" width="280" height="36" rx="14" fill="#f8f9fb"/>
    <rect x="120" y="152" width="280" height="14" fill="#f8f9fb"/>
    <!-- Window dots -->
    <circle cx="146" cy="148" r="5" fill="#e63946" opacity="0.7"/>
    <circle cx="164" cy="148" r="5" fill="#ffb347" opacity="0.7"/>
    <circle cx="182" cy="148" r="5" fill="#4ecdc4" opacity="0.7"/>
    <!-- URL bar -->
    <rect x="220" y="141" width="100" height="14" rx="7" fill="#e5eaf0"/>

    <!-- Video player area -->
    <rect x="140" y="178" width="160" height="100" rx="8" fill="#0b1a2b"/>
    <!-- Play button -->
    <circle cx="220" cy="228" r="18" fill="#e63946" opacity="0.9">
      <animate attributeName="r" values="18;20;18" dur="2s" repeatCount="indefinite"/>
    </circle>
    <polygon points="214,218 214,238 230,228" fill="#fff"/>
    <!-- Progress bar -->
    <rect x="150" y="262" width="140" height="4" rx="2" fill="#1b3a5f"/>
    <rect x="150" y="262" width="0" height="4" rx="2" fill="#e63946">
      <animate attributeName="width" values="0;84;84;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Sidebar modules -->
    <rect x="314" y="178" width="72" height="22" rx="6" fill="#e63946" opacity="0.12"/>
    <rect x="322" y="185" width="40" height="5" rx="2.5" fill="#e63946" opacity="0.7"/>
    <rect x="314" y="206" width="72" height="22" rx="6" fill="#f4f6fa"/>
    <rect x="322" y="213" width="40" height="5" rx="2.5" fill="#5b7a9d" opacity="0.5"/>
    <rect x="314" y="234" width="72" height="22" rx="6" fill="#f4f6fa"/>
    <rect x="322" y="241" width="40" height="5" rx="2.5" fill="#5b7a9d" opacity="0.5"/>
    <rect x="314" y="262" width="72" height="22" rx="6" fill="#f4f6fa"/>
    <rect x="322" y="269" width="40" height="5" rx="2.5" fill="#5b7a9d" opacity="0.5"/>

    <!-- Laptop base -->
    <rect x="90" y="310" width="340" height="12" rx="6" fill="#e5eaf0"/>
    <rect x="220" y="310" width="80" height="5" rx="2.5" fill="#d4dce6"/>
  </g>

  <!-- Floating card: code snippet -->
  <g class="fl2">
    <rect x="20" y="80" width="110" height="80" rx="12" fill="#ffffff" stroke="#e5eaf0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="34" y="96" width="50" height="5" rx="2.5" fill="#e63946" opacity="0.7"/>
    <rect x="34" y="108" width="80" height="5" rx="2.5" fill="#5b7a9d" opacity="0.5"/>
    <rect x="34" y="120" width="60" height="5" rx="2.5" fill="#4ecdc4" opacity="0.5"/>
    <rect x="34" y="132" width="70" height="5" rx="2.5" fill="#5b7a9d" opacity="0.3"/>
    <!-- Code icon -->
    <text x="100" y="100" fill="#e63946" font-size="14" opacity="0.5">&lt;/&gt;</text>
  </g>

  <!-- Floating card: certificate -->
  <g class="fl3">
    <rect x="400" y="100" width="100" height="80" rx="12" fill="#ffffff" stroke="#e5eaf0" stroke-width="1.5"/>
    <circle cx="450" cy="130" r="16" fill="#e63946" opacity="0.1" stroke="#e63946" stroke-width="1.5"/>
    <text x="450" y="135" text-anchor="middle" fill="#e63946" font-size="14" font-weight="bold">✓</text>
    <rect x="418" y="156" width="64" height="5" rx="2.5" fill="#5b7a9d" opacity="0.5"/>
    <rect x="426" y="166" width="48" height="4" rx="2" fill="#5b7a9d" opacity="0.3"/>
  </g>

  <!-- Floating badge: star -->
  <g class="fl2">
    <circle cx="60" cy="260" r="22" fill="#ffffff" stroke="#e5eaf0" stroke-width="1.5"/>
    <text x="60" y="266" text-anchor="middle" fill="#e63946" font-size="18">★</text>
  </g>

  <!-- Floating badge: progress -->
  <g class="fl1">
    <rect x="420" y="260" width="80" height="44" rx="10" fill="#ffffff" stroke="#e5eaf0" stroke-width="1.5"/>
    <rect x="434" y="274" width="52" height="6" rx="3" fill="#e5eaf0"/>
    <rect x="434" y="274" width="0" height="6" rx="3" fill="#4ecdc4">
      <animate attributeName="width" values="0;36;52;52;0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="460" y="296" text-anchor="middle" fill="#5b7a9d" font-size="8" font-weight="600">Progress</text>
  </g>

  <!-- Animated connection dots -->
  <circle cx="130" cy="170" fill="#e63946" class="pls" r="6"/>
  <circle cx="390" cy="170" fill="#4ecdc4" class="pls" r="6" style="animation-delay:1s"/>

  <!-- Dashed connection lines -->
  <line x1="130" y1="130" x2="80" y2="100" stroke="#e63946" stroke-width="1" stroke-dasharray="5 5" opacity="0.4" class="dsh"/>
  <line x1="390" y1="140" x2="440" y2="120" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="5 5" opacity="0.4" class="dsh"/>

  <!-- Bottom text chips -->
  <g class="fl2">
    <rect x="140" y="350" width="100" height="32" rx="16" fill="#ffffff" stroke="#e5eaf0" stroke-width="1"/>
    <text x="190" y="370" text-anchor="middle" fill="#e63946" font-size="10" font-weight="600">Live Classes</text>
  </g>
  <g class="fl3">
    <rect x="260" y="350" width="120" height="32" rx="16" fill="#ffffff" stroke="#e5eaf0" stroke-width="1"/>
    <text x="320" y="370" text-anchor="middle" fill="#0b1a2b" font-size="10" font-weight="600">Real Projects</text>
  </g>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0b1a2b" flood-opacity="0.08"/>
    </filter>
  </defs>
</svg>

    <circle r="35" fill="#162d45"/>
    <circle r="16" fill="#e63946" opacity="0.3"/>
    <!-- Gear teeth -->
    <rect x="-8" y="-72" width="16" height="24" rx="4" fill="#10243a" stroke="#1b3a5f" stroke-width="1.5"/>
    <rect x="-8" y="48" width="16" height="24" rx="4" fill="#10243a" stroke="#1b3a5f" stroke-width="1.5"/>
    <rect x="-72" y="-8" width="24" height="16" rx="4" fill="#10243a" stroke="#1b3a5f" stroke-width="1.5"/>
    <rect x="48" y="-8" width="24" height="16" rx="4" fill="#10243a" stroke="#1b3a5f" stroke-width="1.5"/>
    <rect x="36" y="-56" width="16" height="24" rx="4" fill="#10243a" stroke="#1b3a5f" stroke-width="1.5" transform="rotate(45 44 -44)"/>
    <rect x="-52" y="32" width="16" height="24" rx="4" fill="#10243a" stroke="#1b3a5f" stroke-width="1.5" transform="rotate(45 -44 44)"/>
    <rect x="-52" y="-56" width="16" height="24" rx="4" fill="#10243a" stroke="#1b3a5f" stroke-width="1.5" transform="rotate(-45 -44 -44)"/>
    <rect x="36" y="32" width="16" height="24" rx="4" fill="#10243a" stroke="#1b3a5f" stroke-width="1.5" transform="rotate(-45 44 44)"/>

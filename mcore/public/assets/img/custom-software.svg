    <rect x="14" y="14" width="50" height="6" rx="3" fill="#4ecdc4" opacity="0.6"/>
    <rect x="14" y="28" width="82" height="6" rx="3" fill="#5b7a9d" opacity="0.4"/>
    <rect x="14" y="42" width="60" height="6" rx="3" fill="#5b7a9d" opacity="0.3"/>
  </g>
  <g transform="translate(40, 290)">
    <rect width="110" height="70" rx="12" fill="#fff" stroke="#e5eaf0" stroke-width="1"/>
    <rect x="14" y="14" width="50" height="6" rx="3" fill="#5b7a9d" opacity="0.5"/>
    <rect x="14" y="28" width="82" height="6" rx="3" fill="#e63946" opacity="0.3"/>
    <rect x="14" y="42" width="60" height="6" rx="3" fill="#5b7a9d" opacity="0.3"/>
  </g>

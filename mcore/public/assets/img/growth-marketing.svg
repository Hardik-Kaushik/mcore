<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Growth chart background -->
  <rect x="60" y="40" width="380" height="280" rx="16" fill="#10243a" stroke="#1b3a5f" stroke-width="2"/>
  <!-- Grid -->
  <line x1="100" y1="80" x2="100" y2="280" stroke="#1b3a5f" stroke-width="0.5"/>
  <line x1="170" y1="80" x2="170" y2="280" stroke="#1b3a5f" stroke-width="0.5"/>
  <line x1="240" y1="80" x2="240" y2="280" stroke="#1b3a5f" stroke-width="0.5"/>
  <line x1="310" y1="80" x2="310" y2="280" stroke="#1b3a5f" stroke-width="0.5"/>
  <line x1="380" y1="80" x2="380" y2="280" stroke="#1b3a5f" stroke-width="0.5"/>
  <line x1="100" y1="120" x2="400" y2="120" stroke="#1b3a5f" stroke-width="0.5"/>
  <line x1="100" y1="160" x2="400" y2="160" stroke="#1b3a5f" stroke-width="0.5"/>
  <line x1="100" y1="200" x2="400" y2="200" stroke="#1b3a5f" stroke-width="0.5"/>
  <line x1="100" y1="240" x2="400" y2="240" stroke="#1b3a5f" stroke-width="0.5"/>
  <line x1="100" y1="280" x2="400" y2="280" stroke="#1b3a5f" stroke-width="0.5"/>
  <!-- Bar chart -->
  <rect x="110" y="220" width="30" height="60" rx="4" fill="#e63946" opacity="0.3"/>
  <rect x="180" y="190" width="30" height="90" rx="4" fill="#e63946" opacity="0.4"/>
  <rect x="250" y="160" width="30" height="120" rx="4" fill="#e63946" opacity="0.5"/>
  <rect x="320" y="120" width="30" height="160" rx="4" fill="#e63946" opacity="0.7"/>
  <rect x="390" y="90" width="30" height="190" rx="4" fill="#e63946" opacity="0.9"/>
  <!-- Growth line -->
  <polyline points="125,210 195,178 265,148 335,108 405,80" stroke="#ff6b6b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="125" cy="210" r="5" fill="#ff6b6b"/>
  <circle cx="195" cy="178" r="5" fill="#ff6b6b"/>
  <circle cx="265" cy="148" r="5" fill="#ff6b6b"/>
  <circle cx="335" cy="108" r="5" fill="#ff6b6b"/>
  <circle cx="405" cy="80" r="5" fill="#ff6b6b"/>
  <!-- Arrow up -->
  <g transform="translate(405, 55)">
    <polygon points="0,12 8,0 16,12" fill="#4ecdc4"/>
    <rect x="5" y="12" width="6" height="14" rx="2" fill="#4ecdc4"/>
  </g>
  <!-- Floating metric cards -->
  <g transform="translate(60, 330)">
    <rect width="110" height="50" rx="10" fill="#fff" stroke="#e5eaf0" stroke-width="1"/>
    <rect x="14" y="12" width="40" height="5" rx="2.5" fill="#e63946" opacity="0.5"/>
    <rect x="14" y="26" width="80" height="10" rx="4" fill="#e63946" opacity="0.15"/>
    <text x="54" y="35" text-anchor="middle" fill="#e63946" font-size="9" font-weight="bold">+127% MoM</text>
  </g>
  <g transform="translate(200, 330)">
    <rect width="110" height="50" rx="10" fill="#fff" stroke="#e5eaf0" stroke-width="1"/>
    <rect x="14" y="12" width="40" height="5" rx="2.5" fill="#4ecdc4" opacity="0.5"/>
    <rect x="14" y="26" width="80" height="10" rx="4" fill="#4ecdc4" opacity="0.15"/>
    <text x="54" y="35" text-anchor="middle" fill="#4ecdc4" font-size="9" font-weight="bold">3.2x ROAS</text>
  </g>
  <g transform="translate(340, 330)">
    <rect width="110" height="50" rx="10" fill="#fff" stroke="#e5eaf0" stroke-width="1"/>
    <rect x="14" y="12" width="40" height="5" rx="2.5" fill="#5b7a9d" opacity="0.5"/>
    <rect x="14" y="26" width="80" height="10" rx="4" fill="#5b7a9d" opacity="0.15"/>
    <text x="54" y="35" text-anchor="middle" fill="#5b7a9d" font-size="9" font-weight="bold">42K Leads</text>
  </g>
</svg>

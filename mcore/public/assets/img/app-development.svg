<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Mobile phone -->
  <rect x="170" y="30" width="160" height="300" rx="24" fill="#10243a" stroke="#1b3a5f" stroke-width="2"/>
  <rect x="182" y="60" width="136" height="240" rx="4" fill="#162d45"/>
  <!-- Status bar -->
  <rect x="220" y="42" width="60" height="6" rx="3" fill="#1b3a5f"/>
  <!-- App content -->
  <rect x="196" y="80" width="108" height="14" rx="4" fill="#e63946" opacity="0.7"/>
  <rect x="196" y="104" width="80" height="8" rx="4" fill="#5b7a9d" opacity="0.5"/>
  <rect x="196" y="126" width="108" height="60" rx="8" fill="#1b3a5f"/>
  <circle cx="250" cy="156" r="14" fill="#e63946" opacity="0.3"/>
  <rect x="196" y="200" width="50" height="8" rx="4" fill="#5b7a9d" opacity="0.5"/>
  <rect x="256" y="200" width="48" height="8" rx="4" fill="#4ecdc4" opacity="0.4"/>
  <rect x="196" y="220" width="108" height="40" rx="8" fill="#e63946" opacity="0.15"/>
  <rect x="210" y="234" width="80" height="12" rx="6" fill="#e63946" opacity="0.6"/>
  <!-- Home indicator -->
  <rect x="225" y="312" width="50" height="4" rx="2" fill="#5b7a9d" opacity="0.4"/>
  <!-- Floating cards -->
  <g transform="translate(50, 80)">
    <rect width="100" height="70" rx="12" fill="#fff" stroke="#e5eaf0" stroke-width="1"/>
    <rect x="14" y="14" width="40" height="6" rx="3" fill="#e63946" opacity="0.6"/>
    <rect x="14" y="28" width="72" height="6" rx="3" fill="#5b7a9d" opacity="0.4"/>
    <rect x="14" y="42" width="56" height="6" rx="3" fill="#5b7a9d" opacity="0.3"/>
  </g>
  <g transform="translate(350, 140)">
    <rect width="100" height="70" rx="12" fill="#fff" stroke="#e5eaf0" stroke-width="1"/>
    <circle cx="30" cy="28" r="10" fill="#4ecdc4" opacity="0.3"/>
    <rect x="48" y="22" width="38" height="6" rx="3" fill="#5b7a9d" opacity="0.5"/>
    <rect x="14" y="46" width="72" height="6" rx="3" fill="#5b7a9d" opacity="0.3"/>
  </g>
  <!-- Connection lines -->
  <line x1="150" y1="115" x2="170" y2="130" stroke="#e63946" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <line x1="350" y1="175" x2="330" y2="180" stroke="#4ecdc4" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <!-- Glow -->
  <ellipse cx="250" cy="370" rx="140" ry="20" fill="#e63946" opacity="0.08"/>
</svg>
